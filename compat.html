<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drive TV · Compatibility test</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101011;color:#f5f3f0;font:16px Arial,sans-serif}main{max-width:1200px;margin:auto;padding:24px}a{color:inherit}h1{font-size:25px;margin:22px 0 10px}p{color:#b7aca8;line-height:1.5}#screen{height:min(62vh,650px);min-height:240px;background:black;position:relative}button,select{font:inherit;min-height:46px;padding:10px 16px;background:#2b282b;color:white;border:1px solid #ffffff25;border-radius:5px}button{cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid white;outline-offset:4px}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:20px 0}label{display:flex;align-items:center;gap:9px}#play{background:#f5f3f0;color:#101011}#status{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}#stats{color:#aaa;font-size:12px;line-height:1.6}input[type=range]{flex:1;min-width:160px}#screen canvas,#screen video{max-width:100%;max-height:100%}
</style></head><body><main><a href="%BASE_URL%">← Back to Drive TV</a><h1>Compatibility playback test</h1><p id="title">Uses your saved Drive TV settings or the deployment defaults. The movie stays in Drive.</p><div id="screen"></div><div class="controls"><button id="play">Load and play</button><button id="rewind">−10s</button><button id="pause">Pause</button><button id="forward">+10s</button><button id="fullscreen">Fullscreen</button></div><div class="controls"><span id="clock">0:00</span><input aria-label="Seek" id="seek" type="range" min="0" max="1" value="0" step="1"><label>Audio <select id="audio"><option value="">Loading tracks…</option></select></label><label>Subtitles <select id="subtitles"><option value="off">Off</option></select></label></div><p id="status" role="status">Ready to test.</p><div id="stats"></div><script type="module" src="/src/compat-probe.js"></script></main></body></html>
